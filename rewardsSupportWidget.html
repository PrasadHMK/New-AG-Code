<template>
  <template lwc:if={hasPayload}>
    <section class="widget">
      <template lwc:if={isMissingPointsInteractive}>
        <template lwc:if={showMissingPointsHero}>
          <section class="hero-card">
            <div class="hero-card__header">
              <p class="eyebrow">Missing Points</p>
            </div>
            <p class="hero-card__message">{interactiveHeaderMessage}</p>
          </section>
        </template>
        <template lwc:if={showMissingPointsRootActions}>
          <section class="detail-card">
            <div class="button-stack button-stack--inline">
              <button class="choice-button" data-path="inStore" onclick={handleMissingPointsPathClick}>{storeButtonLabel}</button>
              <button
                    class="choice-button choice-button--secondary"
                    data-path="hallmark"
                    onclick={handleMissingPointsPathClick}>{hallmarkButtonLabel}</button>
            </div>
            <button class="text-button" onclick={handleCancelMissingPointsFlow}>{cancelButtonLabel}</button>
          </section>
        </template>
        <template lwc:if={showMissingPointsCancelled}>
          <section class="notice-card">
            <p class="notice-card__message">{cancelledMessage}</p>
            <button class="text-button" onclick={handleBackToMainInStoreQuestion}>Back</button>
          </section>
        </template>
        <template lwc:if={showInStoreQuestion}>
          <section class="detail-card">
            <p class="detail-value">{storePromptMessage}</p>
            <div class="button-stack button-stack--inline">
              <button class="choice-button" data-answer="yes" onclick={handleInStoreEligibilityClick}>Yes</button>
              <button class="choice-button" data-answer="no" onclick={handleInStoreEligibilityClick}>No</button>
            </div>
          </section>
        </template>
        <template lwc:if={showInStoreReceiptQuestion}>
          <section class="detail-card">
            <p class="detail-value">{storeReceiptPromptMessage}</p>
            <div class="button-stack button-stack--inline">
              <button class="choice-button" data-answer="yes" onclick={handleInStoreReceiptClick}>Yes</button>
              <button class="choice-button" data-answer="no" onclick={handleInStoreReceiptClick}>No</button>
            </div>
          </section>
        </template>
        <template lwc:if={showInStoreCaseForm}>
          <section class="detail-card">
            <div class="section-heading">
              <p class="label">{storeFormTitle}</p>
            </div>
            <p class="detail-value detail-value--spaced">{storeFormMessage}</p>
            <div class="form-grid">
              <lightning-input
                    label="First Name"
                    data-field="inStoreFirstName"
                    value={inStoreFirstName}
                    required
                    message-when-value-missing="First name is required."
                    onchange={handleStoreFormInput}></lightning-input>
              <lightning-input
                    label="Last Name"
                    data-field="inStoreLastName"
                    value={inStoreLastName}
                    required
                    message-when-value-missing="Last name is required."
                    onchange={handleStoreFormInput}></lightning-input>
              <lightning-input
                    type="email"
                    label="Email"
                    data-field="inStoreEmail"
                    value={inStoreEmail}
                    required
                    message-when-value-missing="Email is required."
                    onchange={handleStoreFormInput}></lightning-input>
              <lightning-input
                    type="file"
                    label="Receipt Upload"
                    required
                    message-when-value-missing="Receipt upload is required."
                    accept=".bmp, .csv, .doc, .docx, .gif, .jpg, .jpeg, .pdf, .png, .tiff, .txt, .xls, .xlsx, .xml"
                    onchange={handleUploadFile}></lightning-input>
              <template lwc:if={fileErrorMessage}>
                <p class="error-message">{fileErrorMessage}</p>
              </template>
              <p class="supported-files-info">We accept files smaller than 4.5MB in the following formats: .bmp, .csv, .doc, .docx, .gif, .jpg, .jpeg, .pdf, .png, .tiff, .txt, .xls, .xlsx, and .xml</p>
            </div>
            <template lwc:if={uploadedFileName}>
              <p class="file-name">Selected file: {uploadedFileName}</p>
            </template>
            <template lwc:if={showInteractiveError}>
              <p class="error-message">{interactiveErrorMessage}</p>
            </template>
            <div class="button-stack button-stack--inline">
              <button
                    class="choice-button choice-button--light-submit"
                    onclick={handleSubmitInStoreCase}
                    disabled={isSubmittingInStoreCase}>Submit</button>
              <button class="choice-button choice-button--secondary" onclick={handleClearInStoreCase}>Clear</button>
            </div>
          </section>
        </template>
        <template lwc:if={showInStoreCaseCreated}>
          <section class="notice-card">
            <p class="label">Case Created</p>
            <p class="notice-card__message">
              Case number:
              <span class="notice-card__case"> {inStoreCaseCreatedNumber}</span>
              &nbsp;has been opened for you. Please allow us 24 to 48 hours to review and keep a look out for an email from Hallmark!.Is there anything else I can assist you with today?
            </p>
            <div class="detail-list detail-list--spaced">
              <p class="detail-list__item">
                <span class="label">First Name: </span>
                {confirmationFirstName}
              </p>
              <p class="detail-list__item">
                <span class="label">Last Name: </span>
                {confirmationLastName}
              </p>
              <p class="detail-list__item">
                <span class="label">Email: </span>
                {confirmationEmail}
              </p>
              <template lwc:if={hasConfirmationReceipt}>
                <p class="detail-list__item">
                  <span class="label">Receipt: </span>
                  {confirmationReceiptFileName}
                </p>
              </template>
            </div>
          </section>
        </template>
        <template lwc:if={showInStoreWaitMessage}>
          <section class="notice-card">
            <p class="notice-card__message">{storeWaitMessage}</p>
            <button class="text-button" onclick={handleBackToMainInStoreQuestion}>Back</button>
          </section>
        </template>
      </template>
      <template lwc:else>
        <template lwc:if={hasStructuredHero}>
          <section class="hero-card">
            <div class="hero-card__header">
              <p class="eyebrow">{heroTitle}</p>
              <template lwc:if={hasMembershipNumber}>
                <span class="member-badge">CR #{formattedCrownRewardsNumber}</span>
              </template>
            </div>
            <template lwc:if={heroMessage}>
              <p class="hero-card__message">{heroMessage}</p>
            </template>
          </section>
        </template>
        <template lwc:if={showOverview}>
          <div class="stats-grid">
            <template lwc:if={hasMembershipTier}>
              <article class="stat-card stat-card--tier">
                <p class="label">Tier</p>
                <p class="stat-value">{membershipTier}</p>
              </article>
            </template>
            <template lwc:if={hasPointsBalance}>
              <article class="stat-card stat-card--balance">
                <p class="label">Points Balance</p>
                <p class="stat-value">{pointsBalance}</p>
              </article>
            </template>
            <template lwc:if={hasPointsToPlatinum}>
              <article class="stat-card stat-card--platinum">
                <p class="label">Points To Platinum</p>
                <p class="stat-value">{pointsToPlatinum}</p>
              </article>
            </template>
          </div>
        </template>
        <template lwc:if={showRewardsAndOffers}>
          <div class="section-stack">
            <template lwc:if={hasRewards}>
              <section class="detail-card detail-card--rewards">
                <div class="section-heading">
                  <p class="label">Available Rewards ({rewardsCount})</p>
                </div>
                <ul class="detail-list">
                  <template for:each={rewardListItems} for:item="reward">
                    <li key={reward.key} class="detail-list__item">{reward.label}</li>
                  </template>
                </ul>
              </section>
            </template>
            <template lwc:if={hasBonusOffers}>
              <section class="detail-card detail-card--bonus">
                <div class="section-heading">
                  <p class="label">Available Bonus Offers ({bonusOffersCount})</p>
                </div>
                <ul class="detail-list">
                  <template for:each={bonusOfferListItems} for:item="offer">
                    <li key={offer.key} class="detail-list__item">{offer.label}</li>
                  </template>
                </ul>
              </section>
            </template>
          </div>
        </template>
        <template lwc:if={showGuidance}>
          <section class="detail-card">
            <div class="section-heading">
              <p class="label">Available Reward Values</p>
            </div>
            <div class="reward-choice-grid">
              <template for:each={rewardChoiceCards} for:item="choice">
                <article key={choice.key} class={choice.className}>
                  <p class="reward-choice-card__value">{choice.label}</p>
                </article>
              </template>
            </div>
          </section>
        </template>
      </template>
    </section>
  </template>
</template>
