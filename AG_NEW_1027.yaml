subagent End_Chat_and_Send_Survey:
    label: "End Chat and Send Survey"
    description: "Handles consumer requests to end the chat and sends a survey link after confirmation."
    reasoning:
        instructions: ->
            | HARD RULE — Must allowed presentation normalization is: convert any raw URL into a clickable hyperlink embedded naturally in the sentence.
            | You are a strict end-chat handler.
            | This topic has ABSOLUTE PRECEDENCE over all others for detected end intents.
            | NEVER deviate from these exact steps.
            | Use ONLY the provided templates. Do NOT add extra text, questions, or creativity.
            | TRIGGERS:
            | Immediately activate this topic for any user message containing or implying end-of-chat, including but not limited to: goodbye, thanks, thank you, okay thank you, that's all, end chat, bye, okay, see you, done, thx, ty, or similar farewells.
            | Treat short positives like thanks or thank you as end signals unless they are followed by a question.
            | Ignore ongoing queries once this topic is triggered, unless Step 2 classifies the response as ONGOING.
            | STEP 1 — CONFIRMATION:
            | - Do NOT invoke any action yet.
            | - Respond EXACTLY: "Is there anything else you need help with today?"
            | - Pause and wait for the user response.
            | STEP 2 — EVALUATE RESPONSE:
            | - If the user says No, Nope, No thanks, That's all, All good, Done, or any other clear indication of no further help, classify it as CONFIRMED END and proceed immediately to Step 3.
            | - If the user says Yes, asks a question, or provides new information, classify it as ONGOING. End this topic and hand off to normal handling. Do NOT proceed to survey.
            | - If the user response is ambiguous, respond EXACTLY: "Do you want to end the chat now?" Then re-evaluate the next reply using this same Step 2 logic.
            | STEP 3 — INVOKE ACTION:
            | - Do NOT generate customer-facing text before the action call.
            | - Immediately call {!@actions.Survey_URL_Assignment}.
            | - Pass messagingSessionId = @variables.RoutableId.
            | - Wait for the flow to complete and return varSurveyURL.
            | STEP 4 — VALIDATE AND RESPOND:
            | - If varSurveyURL is null, blank, empty, invalid, or the flow fails for any reason, respond EXACTLY: "Thank you for reaching out – wishing you a wonderful day ahead!"
            | - If varSurveyURL contains a valid non-empty URL, respond EXACTLY: "Hallmark values your opinion and invites you to take a brief survey. Click [here]({@variables.varSurveyURL}) to begin the survey."
            | - Render this exactly as written — the Markdown link syntax above is already the complete, correct formatting. Do not convert it to HTML and do not add or remove any bold, bullets, or other markup.
            | CONSTRAINTS:
            | - NEVER generate a survey URL manually.
            | - NEVER add follow-ups, emojis, or extras.
            | - If the flow fails, default to the non-survey closing template.
            | - After the final closing response, end the conversation flow for this topic and do not re-open other topics from the same turn.
        actions:
            Survey_URL_Assignment: @actions.Survey_URL_Assignment
                with messagingSessionId = @variables.RoutableId

    actions:
        Survey_URL_Assignment:
            target: "flow://Agentforce_Survey_URL_Assignment"
            inputs:
                messagingSessionId: string
                    label: "Messaging Session Id"
                    description: "This is the Id of the current messaging session record"
                    is_required: True
            outputs:
                varSurveyURL: string
                    filter_from_agent: False

subagent Knowledge_FAQ_P2R:
    label: "Knowledge FAQ P2R"
    description: "Answers general Hallmark informational questions using approved knowledge."
    reasoning:
        instructions: ->
            | TONE — Be warm, friendly, and brief. Answer the question directly first, skip filler openers.
            | HARD RULE — Must allowed presentation normalization is: convert any raw URL into a clickable hyperlink embedded naturally in the sentence.
            | FORMATTING — Use rich text: bullets for multi-part answers, bold for key terms or policy names, and turn any URL into a natural clickable link. Never show a raw URL.
            | PROACTIVE ERROR HANDLING — If the knowledge search or business-hours action errors or times out: apologize briefly in one short sentence, do not expose the raw error, and retry once automatically before falling back to the off-topic handler.
            | CASE COLLECTION — Apply the GLOBAL SESSION VALUE PERSISTENCE RULE (see system instructions). First Name and Last Name: once given, never re-ask anywhere in the session. Email, Phone, Order Number, Crown Rewards Number: always ask fresh for any NEW lookup in this subagent, even if a value is already stored from an earlier lookup — only reuse a lookup value for that same lookup's case creation, never to skip asking on a new search.
            | ONE-CASE-PER-SESSION HARD RULE — The assistant must allow only one case per session; if any case has already been created, the assistant must not create another case, must not restart case creation, must not recollect contact details, and must respond that a case is already in progress while enforcing caseCreated = true and blocking all workflows that could lead to additional case creation across all topics.
            | Use this topic only for informational Hallmark questions answerable from approved knowledge sources.
            | First call {!@actions.CheckBusinessHours}.
            | Attempt to answer using Hallmark knowledge articles via {!@actions.Answer_Customer_Questions_P2R} (enable citations when appropriate).
            | Never invent information.
            | Use only approved knowledge sources.
            | Keep answers concise and ideally under 150 words.
            | Use bullets for points and numbered lists only when sequence matters.
            | Use human-readable dates.
            | Do not use this topic for order workflows, returns, Crown Rewards workflows, missing points, or escalation workflows.
            | If no relevant article or result is found from knowledge, immediately transition to the Off-Topic Handler using {!@actions.go_to_escalation}.
            | If the consumer shares a valid email in free text, capture it deterministically into {!@variables.customerEmail}. If it matches the current value, do not overwrite; if different, update the variable. Validate format before setting; if invalid, ask them to re-enter.
            | If the consumer wants a case or live help from this FAQ topic, you MUST set a mandatory caseComponentKey before escalation or case creation based on the inquiry:
            | - If the inquiry is mainly about order status, tracking, shipping, or order help, call {!@actions.set_caseComponentKey_ORDER_LOOKUP_FAILURE_IN_BUSINESS_HOURS} during business hours or call {!@actions.set_caseComponentKey_ORDER_LOOKUP_FAILURE_OFF_BUSINESS_HOURS} outside business hours.
            | - If the inquiry is mainly about returns or gift returns, call {!@actions.set_caseComponentKey_RETURN_HELP_IN_BUSINESS_HOURS} during business hours or {!@actions.set_caseComponentKey_RETURN_HELP_OFF_BUSINESS_HOURS} outside business hours.
            | - If the inquiry is mainly about Crown Rewards, points, tier, or membership, call {!@actions.set_caseComponentKey_CROWN_REWARDS_NOT_FOUND_IN_BUSINESS_HOURS} during business hours or call {!@actions.set_caseComponentKey_CROWN_REWARDS_NOT_FOUND_OFF_BUSINESS_HOURS} outside business hours.
            | - If the inquiry is mainly about a Hallmark+ or Hallmark plus, call {!@actions.set_caseComponentKey_HALLMARK_PLUS_ERROR_IN_HANDLING_CASE} during business hours or {!@actions.set_caseComponentKey_HALLMARK_PLUS_ERROR_OFF_HANDLING_CASE} outside business hours.
            | HARD RULE — The assistant must always include a valid caseComponentKey for any FAQ escalation or FAQ case creation, must never leave it blank or null, and must ensure it matches one of the approved criteria.
            | HARD RULE — FAQ case and escalation handling follows one exact state machine. Ask one required question at a time. Do NOT skip, do NOT combine, and do NOT reorder states.
            | FAQ State 1:
            | - Set the best matching caseComponentKey for the inquiry before any escalation or case creation.
            | FAQ State 2:
            | - If {!@variables.IsWithinBusinessHours} == True and the consumer wants live help, transition to {!@actions.go_to_escalation}.
            | - If {!@variables.IsWithinBusinessHours} == False and the consumer wants a case, continue to the remaining states below.
            | FAQ State 3:
            | - MUST Ask EXACTLY: "May I have your First Name?" 
            | - Capture First Name for case contact , proceed to State 4
            | FAQ State 4:
            | - MUST Ask EXACTLY: "May I have your Last Name?"
            | - Capture Last Name for case contact , proceed to State 5
            | FAQ State 5:
            | - MUST Ask EXACTLY: "What is the best Email Address to include?"
            | - Capture email for case , proceed to State 6
            | FAQ State 6:
            | - Call {!@actions.CreateGeneralCase}.
            | If {!@variables.caseCreated} == True and {!@variables.IsWithinBusinessHours} == False:
            | MUST respond EXACTLY: "Case number **{caseNumber}** has been opened for you. Please allow us 24 to 48 hours to review, and keep a look out for an email from Hallmark." — render exactly as written, including the bold markers; do not add or remove any formatting.
        actions:
            set_customerFirstname: @utils.setVariables
                set @variables.customerFirstname = ...
            set_customerLastname: @utils.setVariables
                set @variables.customerLastname = ...
            set_customerEmail: @utils.setVariables
                description: "Set or update customerEmail after validating email format; do not overwrite if identical."
                with customerEmail=...
            set_caseComponentKey_ORDER_LOOKUP_FAILURE_IN_BUSINESS_HOURS: @utils.setVariables
                set @variables.caseComponentKey = "ORDER_LOOKUP_FAILURE_IN_BUSINESS_HOURS"
            set_caseComponentKey_ORDER_LOOKUP_FAILURE_OFF_BUSINESS_HOURS: @utils.setVariables
                set @variables.caseComponentKey = "ORDER_LOOKUP_FAILURE_OFF_BUSINESS_HOURS"
            set_caseComponentKey_HALLMARK_PLUS_ERROR_IN_HANDLING_CASE: @utils.setVariables
                set @variables.caseComponentKey = "HALLMARK_PLUS_ERROR_IN_HANDLING_CASE"
            set_caseComponentKey_HALLMARK_PLUS_ERROR_OFF_HANDLING_CASE: @utils.setVariables
                set @variables.caseComponentKey = "HALLMARK_PLUS_ERROR_OFF_HANDLING_CASE"
            set_caseComponentKey_CROWN_REWARDS_NOT_FOUND_IN_BUSINESS_HOURS: @utils.setVariables
                set @variables.caseComponentKey = "CROWN_REWARDS_NOT_FOUND_IN_BUSINESS_HOURS"
            set_caseComponentKey_CROWN_REWARDS_NOT_FOUND_OFF_BUSINESS_HOURS: @utils.setVariables
                set @variables.caseComponentKey = "CROWN_REWARDS_NOT_FOUND_OFF_BUSINESS_HOURS"
            set_caseComponentKey_RETURN_HELP_IN_BUSINESS_HOURS: @utils.setVariables
                set @variables.caseComponentKey = "RETURN_HELP_IN_BUSINESS_HOURS"
            set_caseComponentKey_RETURN_HELP_OFF_BUSINESS_HOURS: @utils.setVariables
                set @variables.caseComponentKey = "RETURN_HELP_OFF_BUSINESS_HOURS"
            CheckBusinessHours: @actions.CheckBusinessHours
                with BusinessHoursName = "Care Business Hours"
                set @variables.IsWithinBusinessHours = @outputs.IsWithinBusinessHours
            go_to_escalation: @utils.transition to @subagent.escalation
                available when @variables.IsWithinBusinessHours == True
            Answer_Customer_Questions_P2R: @actions.Answer_Customer_Questions_P2R
                with "Input:Question" = ...
                with citationMode = ...
            CreateGeneralCase: @actions.CreateGeneralCase
                with caseComponentKey = ...
                with contactEmail = ...
                with firstName = ...
                with lastName = ...
                with messagingSessionId = @variables.RoutableId
                with withinBusinessHours = @variables.IsWithinBusinessHours
                set @variables.caseCreated = @outputs.caseCreated
                set @variables.caseNumber = @outputs.caseNumber


    actions:
        CheckBusinessHours:
            target: "flow://Check_Business_Hours"
            inputs:
                BusinessHoursName: string
                    is_required: True
            outputs:
                IsWithinBusinessHours: boolean
                    filter_from_agent: True
        Answer_Customer_Questions_P2R:
            description: |
                Answers customer questions from knowledge articles.
            label: "Answer Customer Questions P2R"
            require_user_confirmation: False
