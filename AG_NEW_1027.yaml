                with requestType = "return"
                with withinBusinessHours = @variables.IsWithinBusinessHours
                set @variables.CurrentFailedAttemptCount = @outputs.failedAttemptCount
                set @variables.lookupFailed = @outputs.lookupFailed
                set @variables.shouldStartLiveAgent = @outputs.shouldStartLiveAgent
                # If exactly one order is returned/auto-selected, persist the order number for returns
                set @variables.orderNumber = ...
            Answer_Customer_Questions_P2R: @actions.Answer_Customer_Questions_P2R
                with "Input:Question" = ...
                with citationMode = ...
            Create_Order_Case: @actions.Create_Order_Case
                description: " The assistant must create a return case only after the order is identified and all return details are collected, must use the caseComponentKey RETURN_CASE for returns, and must not call case creation until the 6th “Anything else?” question has been repeated 4 times or the customer clearly says “No” or gives a definite negative response."
                with caseComponentKey = ...
                with contactEmail = ...
                with firstName = ...
                with impactedItems = ...
                with lastName = ...
                with messagingSessionId = @variables.RoutableId
                with orderNumber = ...
                with preferredOutcome = ...
                with returnComments = ...
                with withinBusinessHours = @variables.IsWithinBusinessHours
                set @variables.caseCreated = @outputs.caseCreated
                set @variables.caseNumber = @outputs.caseNumber




