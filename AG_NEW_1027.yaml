                with receiptProvided = ...
                with requestType = ...
                with rewardValueRequested = ...
                with searchValue = ...
                with updateFieldName = ...
                with withinBusinessHours = @variables.IsWithinBusinessHours
                set @variables.CurrentFailedAttemptCount = @outputs.failedAttemptCount
                set @variables.lookupFailed = @outputs.lookupFailed
                set @variables.shouldStartLiveAgent = @outputs.shouldStartLiveAgent
            Answer_Customer_Questions_P2R: @actions.Answer_Customer_Questions_P2R
                with "Input:Question" = ...
                with citationMode = ...
            Crown_Rewards_Reward_Conversion: @actions.Crown_Rewards_Reward_Conversion
