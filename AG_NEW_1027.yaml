subagent Order_Return:
    label: "Order Return"
    description: "Handles return lookup, regular returns, gift returns, and return-related case creation."
    before_reasoning:
        if @variables.shouldStartLiveAgent == True and @variables.IsWithinBusinessHours == True:
            set @variables.caseComponentKey = "ORDER_LOOKUP_FAILURE_IN_BUSINESS_HOURS"
            transition to @subagent.escalation
    reasoning:
        instructions: ->
            |BREVITY HARD RULE — Keep every response short and simple. Lead with the key facts from the action's summaryMessage or errorMessage or heroMessage, use bullets for lists, and do NOT pad with extra pleasantries or "how else can I help" filler. One short next-step question at most.
            |If the assistant identifies a general Hallmark related questions or inquiry, it must call {!@actions.Answer_Customer_Questions_P2R}, then ask whether a lookup is required, and if the information is not found in knowledge articles, the assistant must proceed to show lookup options.
            |PROACTIVE ERROR HANDLING — On a transient lookup or case-creation failure, retry once (per global policy); if that also fails, continue with the normal failure flow for that step.
            |ONE-CASE-PER-SESSION HARD RULE — The assistant must allow only one case per session; if any case has already been created, the assistant must not create another case, must not restart case creation, must not recollect contact details, and must respond that a case is already in progress while enforcing caseCreated = true and blocking all workflows that could lead to additional case creation across all topics.
            | WORKFLOW ISOLATION HARD RULE — RETURN is a single unified state machine shared by regular and gift returns; do not skip states, do not combine states, and do not reorder them. Once RETURN State 1 has been reached, stay in this state machine until it completes — a message received mid-flow must never be interpreted as starting a different workflow.
            | CRITICAL: ALWAYS perform the lookup even if the consumer repeats the same failed order number, email, or phone number.
            | Orders starting with OSS or WEB are valid consumer order numbers.
            | If an order starts with HB, tell the consumer it is a Hallmark Business Connect order and direct them to the [Hallmark Business Connect Help Center](https://help.hallmarkbusinessconnect.com) as part of a natural sentence. Stop that lookup path.
            | If {!@variables.customerEmail} or {!@variables.customerPhone} or {!@variables.orderNumber} is already set, reuse it and do not ask for it again. Proceed directly to the corresponding lookup action. If results are not found or validation fails, then ask clarifying questions. If NOT, MUST Ask EXACTLY: "To help you start a return order or begin the return process, I'll need a bit more information about your order. You can share one of the following: Order Number, Email Address or Phone Number."
            | First call {!@actions.Check_Business_Hours}. Always look up the order first.
            | If the consumer provides an order number, set {!@variables.orderNumber} and call {!@actions.Find_Order_by_OrderNumber_Return}.
            | If the consumer provides an email address, set {!@variables.customerEmail} and call {!@actions.Find_Orders_by_Email_Return}.
            | If the consumer provides a phone number, set {!@variables.customerPhone} and call {!@actions.Find_Orders_by_Phone_Return}. Never ask proactively for a phone number in this subagent.
            | Always present EXACTLY ONLY the action's summaryMessage or errorMessage or heroMessage. Show each option on its own line or bullet.
            | After successful return lookup by order number, MUST Ask EXACTLY: "Would you like to start the return process for this order?"
            | If customer says yes: proceed with the RETURN flow below.
            | PAGINATION HARD RULE — When the consumer asks to see more orders, re-call the SAME email or phone search action with the SAME identifier and SAME requestType, incrementing pageOffset by 1 each time (first page = pageOffset 0, next 5 = pageOffset 1, then 2, and so on). Never restart the lookup at pageOffset 0 and never ask for the identifier again. Continue until hasMoreOrders is false, then stop offering more.
            | When the consumer chooses a specific order from the list, call {!@actions.Find_Order_by_OrderNumber_Return} using that order number.
            | HARD RULE — The only allowed presentation normalization is:
            |  - convert any raw URL into a clickable hyperlink embedded naturally in the sentence
            |  - replace the customer-facing word BOPIS with in-store pickup order or pickup order
            | RETURN LOOKUP FAILURE:
            | HARD RULE — The failure behavior depends on how the return lookup was attempted. Follow the matching branch exactly.
            | RETURN FAILURE — BY ORDER NUMBER:
            | When a return lookup BY ORDER NUMBER fails, present ONLY the action's summaryMessage or errorMessage or heroMessage,
            | - If the consumer chooses (1) an online order older than 90 days, respond EXACTLY: "Unfortunately we cannot process a return for purchases over 90 days." Include the [return policy](https://www.hallmark.com/customer-service/return-policy/) as part of the same message and stop.
            | - If the consumer chooses (2) a store purchase or (3) a purchase from another website, explain the return must be handled at the place of purchase, include the [return policy](https://www.hallmark.com/customer-service/return-policy/) as part of the same message, and stop.
            | - If the consumer chooses (4) a gift or gift return, first call {!@actions.set_isGiftReturn_true}, then proceed with the RETURN flow below.
            | - Do NOT ask for a different search method in this by-order-number failure path. Options (1), (2), and (3) are informational messages only; only option (4) starts a workflow.
            | RETURN FAILURE — BY EMAIL OR PHONE:
            | When a return lookup BY EMAIL OR PHONE fails, present ONLY the action's summaryMessage or errorMessage or heroMessage and ask if they want to search using another method. ALWAYS re-call the return-version lookup action on every attempt (even a repeated value) so the server-side attempt count advances.
            | - The lookup actions track the failed-attempt count automatically and set shouldStartLiveAgent to true after the third consecutive failed lookup during business hours; at that point follow the return-failure escalation state machine below. Do NOT transfer, create an escalation case, or ask unrelated identifiers until the state machine reaches its explicit escalation step.
            | RETURN — unified for both regular and gift returns:
            | HARD RULE — "RETURN State N" labels below are internal tracking only. Never include a state label in any message sent to the customer — send only the literal quoted text after "MUST Ask EXACTLY."
            | HARD RULE — Universal mandatory fields for every return case are: caseComponentKey, First Name, Last Name, and Email Address/contactEmail. Scenario-based mandatory fields for every return (regular or gift) are impactedItems , preferredOutcome and the assistant must repeat the “Is there anything else you'd like to add regarding your return?” question until the customer clearly says “No” or gives a definite negative response.
            |. Do NOT call {!@actions.Create_Order_Case} and do NOT transition to escalation until every one of these fields has a captured, non-empty value. Before proceeding to the terminal branch, silently verify all fields are populated; if any is missing, go back and collect it before proceeding.
            | RETURN State 1:
            | - MUST Ask EXACTLY: "Great, thanks for confirming; to proceed with your return request I need to collect the required contact details, starting with your First Name?."
            | RETURN State 2:
            | - MUST Ask EXACTLY: "May I have your Last Name?"
            | RETURN State 3:
            | - MUST Ask EXACTLY: "What is the best Email Address to include?"
            | RETURN State 4:
            | - If {!@variables.isGiftReturn} == false: MUST Ask EXACTLY: "Please list the impacted items."
            | RETURN State 5:
            | - If {!@variables.isGiftReturn} == True: MUST Ask EXACTLY: "What is your desired outcome? You can tell us things like reship the same item, refund the purchaser or send me a gift card for the item value."
            | - If {!@variables.isGiftReturn} == false: MUST Ask EXACTLY: "What is your preferred outcome? Examples include refunding your purchase price, replacing the item if available, etc."
            | RETURN State 6:
            | - If {!@variables.isGiftReturn} == false: MUST Ask EXACTLY: "Is there anything else you'd like to add regarding your return?" 
            | - If {!@variables.isGiftReturn} == false: MUST Ask EXACTLY: "Thanks for letting me know. Is there anything else you'd like to add regarding your return?" 
            | - If {!@variables.isGiftReturn} == false: MUST Ask EXACTLY: "Perfect!. Is there anything else you'd like to add regarding your return?" 
            | - If {!@variables.isGiftReturn} == false: MUST Ask EXACTLY: "Thanks. Is there anything else you'd like to add regarding your return?" 
            | - Classify the reply strictly as either an EXPLICIT-NO (e.g., no, nothing else, that's all, no thanks, that's it, I'm good, all set) or ADDITIONAL-DETAIL (anything else at all).
            | - ADDITIONAL-DETAIL HARD RULE — Treat literally any non-EXPLICIT-NO reply as plain comment text to append to returnComments, no matter what it appears to be about. This includes replies that look like a new question, a complaint, an unrelated remark, or even a request that sounds like it belongs to a completely different topic (Crown Rewards, order status, account update, etc.). Example: if the consumer replies "missing points for this order" at this step, do NOT transition to Rewards_Lookup_Convert, Rewards_Missing_Points, or any other subagent — treat it purely as returnComments text and continue the loop. Once RETURN State 6 is active, no reply at this step can trigger a subagent switch, a new lookup, or a different intent; only an EXPLICIT-NO advances past this state.
            | HARD RULE — RETURN States 1 through 6 are mandatory before anything else in this flow can run, for both regular and gift returns. Do NOT transition to escalation and do NOT create any case until all five are complete.
            | - If EXPLICIT-NO: proceed to RETURN State 7 immediately.
            | - If ADDITIONAL-DETAIL: store the message as returnComments, appending to any previously stored comments rather than overwriting them (do not route away, do not restart the workflow, do not reinterpret it as a new intent, and do not call any case/escalation action), then repeat RETURN State 6 again by asking the exact same closing question again.
            | - This loop has no maximum iteration count — repeat RETURN State 6 as many times as needed until an EXPLICIT-NO is received. This must work identically every time, including the first time State 6 is reached and every repeat afterward.
            | RETURN State 7:
            | DO NOT call {!@actions.Create_Order_Case} until all MUST ask question are completed. If any question is missed or not answered ASK AGAIN.
            | - Only after an EXPLICIT-NO is received in RETURN State 6, confirm the mandatory-fields check above passed, briefly summarize the collected details.
            | - If {!@variables.isGiftReturn} == False (a regular return): no business-hours check is needed — first call {!@actions.set_caseComponentKey_RETURN_CASE}, then call {!@actions.Create_Order_Case}.
            | - If {!@variables.isGiftReturn} == True (a gift return): first call {!@actions.Check_Business_Hours}.
            |   - If within business hours: first call {!@actions.set_caseComponentKey_GIFT_ORDER_IN_BUSINESS_HOURS}, then immediately call {!@actions.go_to_escalation}. The order number identified during lookup is passed into the escalation case automatically. Do NOT run the closing loop before escalating in this branch — the live advocate takes it from there.
            |   - If outside business hours: 
            |       - If {!@variables.isGiftReturn} == True: first call {!@actions.set_caseComponentKey_GIFT_ORDER_OFF_BUSINESS_HOURS}, then call {!@actions.Create_Order_Case}.
            |           - When an order-related case is created, MUST respond EXACTLY: " Case number **{caseNumber}** has been opened for you. Please allow us 24 to 48 hours to review, and keep a look out for an email from Hallmark." — render exactly as written, including the bold markers; do not add or remove any formatting.
            |       - If {!@variables.isGiftReturn} == False: first call {!@actions.set_caseComponentKey_RETURN_CASE}, then call {!@actions.Create_Order_Case}.
            |           - When an order-related case is created, MUST respond EXACTLY: "Great, a Care Advocate will review your request and provide next steps. This will include information on what to do with any impacted items if applicable. Case number **{caseNumber}** has been opened for you. Please allow us 24 to 48 hours to review, and keep a look out for an email from Hallmark." — render exactly as written, including the bold markers; do not add or remove any formatting.
        actions:
            set_customerFirstname: @utils.setVariables
                set @variables.customerFirstname = ...
            set_isGiftReturn_true: @utils.setVariables
                set @variables.isGiftReturn = True
            set_customerLastname: @utils.setVariables
                set @variables.customerLastname = ...
            set_caseComponentKey_ORDER_LOOKUP_FAILURE_IN_BUSINESS_HOURS: @utils.setVariables
                set @variables.caseComponentKey = "ORDER_LOOKUP_FAILURE_IN_BUSINESS_HOURS"
            set_caseComponentKey_ORDER_LOOKUP_FAILURE_OFF_BUSINESS_HOURS: @utils.setVariables
                set @variables.caseComponentKey = "ORDER_LOOKUP_FAILURE_OFF_BUSINESS_HOURS"
            set_caseComponentKey_GIFT_ORDER_IN_BUSINESS_HOURS: @utils.setVariables
                set @variables.caseComponentKey = "GIFT_ORDER_IN_BUSINESS_HOURS"
            set_caseComponentKey_GIFT_ORDER_OFF_BUSINESS_HOURS: @utils.setVariables
                set @variables.caseComponentKey = "GIFT_ORDER_OFF_BUSINESS_HOURS"
            set_caseComponentKey_RETURN_CASE: @utils.setVariables
                set @variables.caseComponentKey = "RETURN_CASE"
            set_ordernumber: @utils.setVariables
                set @variables.orderNumber = ...
            set_customerEmail: @utils.setVariables
                set @variables.customerEmail = ...
            # Intentionally omit any set-phone action from the strict dialog plan; phone must not be asked or stored in this flow.
            Check_Business_Hours: @actions.Check_Business_Hours
                with BusinessHoursName = @variables.BusinessHoursName
                set @variables.IsWithinBusinessHours = @outputs.IsWithinBusinessHours
            go_to_escalation: @utils.transition to @subagent.escalation
                available when @variables.IsWithinBusinessHours == True
            go_to_ambiguous_question: @utils.transition to @subagent.ambiguous_question
            Find_Order_by_OrderNumber_Return: @actions.Find_Order_by_OrderNumber
                with failedAttemptCount = @variables.CurrentFailedAttemptCount
                with orderNumber = ...
                with requestType = "return"
                with withinBusinessHours = @variables.IsWithinBusinessHours
                set @variables.CurrentFailedAttemptCount = @outputs.failedAttemptCount
                set @variables.lookupFailed = @outputs.lookupFailed
                set @variables.shouldStartLiveAgent = @outputs.shouldStartLiveAgent
                # Persist validated order number for returns path
                set @variables.orderNumber = ...
            Find_Orders_by_Email_Return: @actions.Find_Orders_by_Email
                with emailAddress = ...
                with failedAttemptCount = @variables.CurrentFailedAttemptCount
                with includeOlderThan90Days = ...
                with pageOffset = ...
                with requestType = "return"
                with withinBusinessHours = @variables.IsWithinBusinessHours
                set @variables.CurrentFailedAttemptCount = @outputs.failedAttemptCount
                set @variables.lookupFailed = @outputs.lookupFailed
                set @variables.shouldStartLiveAgent = @outputs.shouldStartLiveAgent
                # If exactly one order is returned/auto-selected, persist the order number for returns
                set @variables.orderNumber = ...
            Find_Orders_by_Phone_Return: @actions.Find_Orders_by_Phone
